# 本地**演练专用**覆盖文件（生产绝不能用它）
# ============================================================================
# 三处差异，都只为了在本机把生产链路跑通：
#   1. 把 db 发布到宿主机 5433 —— 宿主机上的脚本（快照还原等）要能连上 V2 库。
#      生产库只应存在于内部网络，proxy 是唯一入口。
#   2. 把"V1 侧的文件"只读挂进应用容器 —— 生产里这些文件在 V1 的对象存储里（R2），
#      演练里用宿主机上的一份占位副本（真实对象要 R2 凭据，本机没有）。
#   3. （存储本身不在 compose 里，见 deploy/rehearsal-storage.mjs）
services:
  db:
    ports:
      - '5433:5432'
  app:
    volumes:
      - ./.devdata/rehearsal-v1-files:/rehearsal-v1-files:ro
