<!DOCTYPE html>
<html lang="zh">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow">
  <meta name="googlebot" content="noindex,nofollow">
  <link rel="icon" href="/favicon.svg">
  <title>TsinglanKindergarten - 清澜山幼儿园课程资源平台</title>
  <!--
    The CSRF token, written into the document by the server.

    `res.locals.csrfToken` is set for every page request by
    `server/common/http/csrf-token.middleware.ts`; Express merges `res.locals` into
    the template context that `@Render('index')` uses, so `{{csrfToken}}` interpolates
    here without the controller passing anything. The client's axios instance reads
    `window.csrfToken` and echoes it as `x-suda-csrf-token`, which the server compares
    against the `suda-csrf-token` COOKIE on every mutating /api/* call.

    This block replaces the aPaaS platform's bootstrap script — a JSON blob the
    platform's view middleware injected (router basename, application name, appId,
    tenantId, …) and which only that platform could fill in. Nothing in this client
    reads any of it any more: the router is mounted at "/", and the product name is
    the <title> above. (`scripts/verify-e2e-deploy.sh` asserts that no platform
    placeholder survives in the served document.)
  -->
  <script>
    window.csrfToken = "{{csrfToken}}";
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/client/src/index.tsx"></script>
</body>

</html>
